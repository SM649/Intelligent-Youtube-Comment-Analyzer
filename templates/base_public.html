<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Intelligent YouTube Comment Analyzer{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body class="font-sans text-text-dark bg-app-bg">
  {% include "_navbar_public.html" %}

  <main class="pt-16 md:pt-20">
    {% include "_flash.html" %}
    {% block content %}{% endblock %}
  </main>

  {% include "_footer.html" %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({ once: true, offset: 100 });
  </script>
  <script src="{{ url_for('static', filename='myjs.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
